# Dedicated disposable test database. Never loads deploy/.env or application data.
name: commerce-tests

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: commerce_test
      POSTGRES_PASSWORD: commerce_test_only
      POSTGRES_DB: commerce_test
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - test-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commerce_test -d commerce_test']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  test-pgdata:
