org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag is required by Flutter Gradle Plugin with AGP 9.x
android.newDsl=false
android.options.suppressUnsupportedOptionWarning=android.newDsl
# Built-in Kotlin (AGP 9): file_picker relies on it to compile its Kotlin
# sources, and does not apply the Kotlin Gradle plugin itself under AGP 9.
android.builtInKotlin=true
