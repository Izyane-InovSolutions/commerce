name: commerce_mobile
description: Customer-facing marketplace mobile application by iZyane.
publish_to: "none"

version: 0.1.0+3

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.0.0
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^11.0.3
  http_parser: ^4.1.2
  firebase_core: ^4.15.0
  # In-repo plugin: installed version, and tester updates through Firebase
  # App Distribution.
  app_update:
    path: packages/app_update

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Not for the app's own UI, which draws its own glyphs (lib/design/
  # glyphs.dart) — only for Android's native text-selection menu, whose
  # overflow button is a Material icon.
  uses-material-design: true

  fonts:
    # Variable font (wght 400–900). Weights are selected through the `wght`
    # axis in lib/design/tokens.dart. Licensed OFL-1.1; see the .txt beside it.
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Variable.ttf
